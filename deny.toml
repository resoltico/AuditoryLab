# cargo-deny policy: the single dependency gate (`cargo deny check`).

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
exclude-dev = true

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 is required by Slint 1.18.1 Linux accessibility and portal dependencies. Its API moved to zbus 6; the pinned consumers require major version 5. This informational maintenance advisory reports no vulnerability." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 is required by Slint 1.18.1 Linux accessibility and portal dependencies. Its API moved to zbus 6; the pinned consumers require the standalone crate. This informational maintenance advisory reports no vulnerability." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 provides macros for the required zvariant 5 API. Its macros moved to zbus 6, which the pinned Slint 1.18.1 consumers cannot use. This informational maintenance advisory reports no vulnerability." },

    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; it is reached only through winit's Wayland title-bar renderer (sctk-adwaita), which parses installed system fonts, not user input" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LicenseRef-Slint-Royalty-free-2.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
