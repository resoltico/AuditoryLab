# Use Rust's bundled MinGW startup and static LLVM unwinder with Windows OS UCRT.
# Explicit --target builds keep these flags off host proc-macro compilation.
[target.x86_64-pc-windows-gnullvm]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=ld.lld", "-C", "link-self-contained=yes", "-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-gnullvm]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=ld.lld", "-C", "link-self-contained=yes", "-C", "target-feature=+crt-static"]

# Cargo links overrides skip freetype-sys build.rs entirely: never compile its
# vulnerable bundled C fallback. Supported Linux builds run from this root and
# use security-updated distribution FreeType/Fontconfig development packages.
[target.x86_64-unknown-linux-gnu.freetype]
rustc-link-lib = ["dylib=freetype"]

[target.aarch64-unknown-linux-gnu.freetype]
rustc-link-lib = ["dylib=freetype"]
