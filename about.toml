# cargo-about configuration for per-product THIRD-PARTY-NOTICES.txt.
# `cargo xtask dist` runs: cargo about generate --format json -c about.toml -m crates/<product>/Cargo.toml --target <triple>
# and formats THIRD-PARTY-NOTICES.txt itself.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LicenseRef-Slint-Royalty-free-2.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
# Resolve the full build graph; xtask checks it, then emits only normal/proc-macro dependency notices.
ignore-build-dependencies = false
ignore-dev-dependencies = true
