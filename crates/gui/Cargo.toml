[package]
name = "auditorylab-gui"
autobins = false
description = "Native desktop frontend for Auditory Lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
auditorylab-presentation.workspace = true
auditorylab-app.workspace = true
slint.workspace = true
rfd.workspace = true
fontique = "=0.11.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSURL", "NSString", "NSGeometry", "NSNotification", "NSOperation"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSFont", "NSWorkspace", "NSAccessibility", "NSButton", "NSControl", "NSView", "NSWindow", "NSSavePanel", "NSOpenPanel", "NSMenu", "NSMenuItem"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "=0.9.0"
zbus = "=6.0.0"
async-io = "=2.6.0"
futures-lite = "=2.6.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[build-dependencies]
embed-resource = "=3.0.12"
slint-build.workspace = true

[dev-dependencies]
auditorylab-core = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
slint = { workspace = true, features = ["renderer-software"] }
tempfile.workspace = true

[[bin]]
name = "auditorylab-gui"
path = "src/main.rs"


[lints]
workspace = true
