[package]
name = "auditorylab-gui"
autobins = false
description = "Native desktop frontend for Auditory Lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
auditorylab.workspace = true
slint.workspace = true
rfd.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "auditorylab-gui"
path = "src/main.rs"


[lints]
workspace = true
