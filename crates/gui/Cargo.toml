[package]
name = "auditorylab-gui"
autobins = false
description = "Native desktop frontend for Auditory Lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
auditorylab.workspace = true
slint.workspace = true
rfd.workspace = true
fontique = "=0.11.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSFont", "NSMenu", "NSMenuItem"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "=0.8.9"
zbus = "=5.19.0"
async-io = "=2.6.0"
futures-lite = "=2.6.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["UI_ViewManagement", "Win32_System_WinRT"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "auditorylab-gui"
path = "src/main.rs"


[lints]
workspace = true
