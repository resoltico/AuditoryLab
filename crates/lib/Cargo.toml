[package]
name = "auditorylab"
description = "Shared application workflows for auditory presets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
[dependencies]
cpal.workspace = true
auditorylab-core.workspace = true
tempfile.workspace = true
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true

[dev-dependencies]
i-slint-compiler = { version = "=1.18.1", default-features = false }
toml.workspace = true
quote = "1.0"
proc-macro2 = "1.0"
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "visit", "parsing"] }
[lints]
workspace = true
