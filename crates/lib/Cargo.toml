[package]
name = "auditorylab"
description = "Shared application workflows for auditory recipes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
[features]
default = []
# Controlled execution fixtures for cross-crate production-adapter tests.
test-support = []
# Default-device playback through CPAL. Portable consumers leave it off.
device-playback = ["dep:cpal"]

[dependencies]
same-file.workspace = true
chrono = { workspace = true, features = ["clock"] }
cap-std.workspace = true
cap-fs-ext.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom.workspace = true
unicode-normalization.workspace = true
cpal = { workspace = true, optional = true }
auditorylab-core.workspace = true
tempfile.workspace = true
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true

[build-dependencies]
toml.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
proptest.workspace = true
waveadapter.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dev-dependencies]
# Safe OS counters for the ignored callback diagnostic; absent from products.
nix = { version = "0.31.3", default-features = false, features = ["time", "resource"] }

[[test]]
name = "library_process"
required-features = ["test-support"]

[[test]]
name = "library_faults"
required-features = ["test-support"]

[[test]]
name = "default_output"
required-features = ["device-playback"]

[lints]
workspace = true
