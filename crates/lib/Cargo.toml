[package]
name = "auditorylab"
description = "Shared application workflows for auditory recipes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
[features]
default = []
# Controlled execution fixtures for cross-crate production-adapter tests.
test-support = []
# Default-device playback through CPAL. Portable consumers leave it off.
device-playback = ["dep:cpal"]

[dependencies]
cpal = { workspace = true, optional = true }
auditorylab-core.workspace = true
tempfile.workspace = true
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true

[build-dependencies]
toml.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
proptest.workspace = true
waveadapter.workspace = true
[[test]]
name = "default_output"
required-features = ["device-playback"]

[lints]
workspace = true
