measures = ["eeg", "behavior"]
methods_locator = "Binaural-beat condition: 240 Hz in the right ear and 255 Hz in the left. One of six 5-minute sound conditions played in random order while 28 adults did a visuospatial working-memory task during EEG. Accuracy rose during the 15 Hz binaural beat and fell during the other conditions."
summary = "Two steady low tones, 255 Hz in the left ear and 240 Hz in the right, which the brain hears as a 15-per-second pulsing (a binaural beat); use headphones. In one study, 28 adults heard it for 5 minutes during a visual memory task, and their accuracy improved slightly, and this was the only sound in the study with an accuracy increase. Reaction times did not differ significantly between the study's sounds. Reviews of binaural-beat research report mixed results."
limitations = "Source findings concern the stated population and condition; adaptations do not establish efficacy for generated audio. See the summary and adaptation for study-specific limitations."
adaptation = "The source generated the tones in MATLAB and let participants set the volume; it states no phase, ramps or sample rate. Tones start at phase zero with a -20 dBFS peak, uncalibrated, with 0.1 s fades added."
