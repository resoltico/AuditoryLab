schema_version = 2
duration_seconds = 60.0
fade_seconds = 0.1

[about]
title = "10 Hz binaural beat"
studied_for = "Human study: Brain-rhythm response"
summary = "200 Hz in the left ear and 210 Hz in the right, heard through headphones as a 10-per-second binaural beat. In one study, 32 adults, half of them musicians, listened while watching a silent film; their brain recordings followed beats near 10 per second most strongly. The study measured brain responses, not effects such as relaxation or focus. Reviews of binaural-beat research report mixed results."
citation = "Ioannou CI, Pereda E, Lindsen JP, Bhattacharya J (2015). Electrical brain responses to an auditory illusion and the impact of musical expertise. PLoS ONE 10(6): e0129486."
source_url = "https://doi.org/10.1371/journal.pone.0129486"
study = "The binaural minute of the 10 Hz block: 200 Hz in the left ear and 210 Hz in the right. Sixteen musicians and sixteen non-musicians watched a silent subtitled film during EEG while 34 blocks played, each 20 s of silence, 1 minute of 200 Hz in both ears, then 1 minute of a binaural beat from 1 to 48 Hz. Beats in the alpha band, 9 to 12 Hz, gave the strongest steady-state responses."
adaptation = "Volume was set by each participant; the source states no phase, ramps or sample rate. Tones start at phase zero with a -20 dBFS peak, uncalibrated, with 0.1 s fades added. The silent interval and the block sequence are not part of this preset. The source's other blocks differ only in the right ear's frequency, 200 Hz plus the beat frequency."

[[component]]
ears = "left"
kind = "tone"
frequency_hz = 200.0
peak_dbfs = -20.0

[[component]]
ears = "right"
kind = "tone"
frequency_hz = 210.0
peak_dbfs = -20.0
