[[evidence]]
source = "orozco-perez-2020"
scope = "reference_condition"
population = "human"
population_detail = "Human study: Relaxation and brain-rhythm response"
condition_role = "test"
measures = ["eeg", "subjective"]
methods_locator = "Binaural-beat condition: 396.5 Hz in the left ear and 403.5 Hz in the right. Sixteen adults heard each of four 8-minute conditions (7 Hz and 40 Hz, binaural and monaural) during EEG. Both beat types entrained cortical activity at the beat frequency, monaural beats more strongly; ratings of mental relaxation and absorption did not differ between conditions."
summary = "396.5 Hz in the left ear and 403.5 Hz in the right: a 7-per-second binaural beat for headphones. In one study, 16 adults listened for 8 minutes: their brain recordings followed the beat, the same two tones mixed together in both ears produced a stronger response, and they felt no more relaxed or absorbed than without the beat. Reviews of binaural-beat research report mixed results."
adaptation = "The source states equal starting phases and the lower tone in the left ear; both tones start at phase zero here. The Stimuli section gives 396.5 Hz and the FFR analysis 397.5 Hz; this recipe uses 396.5 Hz, which gives the stated 7 Hz difference. The source generated sound live at 48 kHz and calibrated output to 70 dB SPL per ear; it does not specify ramps; this recipe uses a -20 dBFS peak per tone, uncalibrated, and adds 0.1 s fades."
