schema_version = 2
duration_seconds = 300.0
fade_seconds = 0.1

[about]
title = "240 Hz pure tone"
studied_for = "Human study: Comparison sound in a working-memory study"
summary = "A steady 240 Hz tone in both ears: the study's comparison sound, the binaural beats' tone without a beat. In one study, 28 adults heard it for 5 minutes during a visual memory task, and their accuracy fell slightly; only the 15 Hz binaural beat improved it. Reaction times did not differ significantly between the study's sounds."
citation = "Beauchene C, Abaid N, Moran R, Diana RA, Leonessa A (2016). The effect of binaural beats on visuospatial working memory and cortical connectivity. PLoS ONE 11(11): e0166630."
source_url = "https://doi.org/10.1371/journal.pone.0166630"
study = "Pure-tone control: 240 Hz in both ears, the carrier of the binaural-beat conditions without a beat. One of six 5-minute sound conditions played in random order while 28 adults did a visuospatial working-memory task during EEG. Accuracy rose during the 15 Hz binaural beat and fell during the other conditions."
adaptation = "The source generated the tones in MATLAB and let participants set the volume; it states no phase, ramps or sample rate. Tones start at phase zero with a -20 dBFS peak, uncalibrated, with 0.1 s fades added."

[[component]]
ears = "both"
kind = "tone"
frequency_hz = 240.0
peak_dbfs = -20.0
