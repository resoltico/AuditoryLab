[about]
title = "40 Hz monaural beat"
studied_for = "Relaxation and brain-rhythm response"
summary = "380 Hz and 420 Hz mixed together in both ears, so the 40-per-second beat is in the sound itself and loudspeakers work too. It was the comparison for the binaural version in a study of 16 adults: this mixed version produced the stronger brain response, and neither made listeners feel more relaxed or absorbed."
citation = "Orozco Perez HD, Dumas G, Lehmann A (2020). Binaural beats through the auditory pathway: from brainstem to connectivity patterns. eNeuro 7(2): ENEURO.0232-19.2020."
source_url = "https://doi.org/10.1523/ENEURO.0232-19.2020"
study = "Monaural-beat control for the 40 Hz binaural condition: 380 Hz and 420 Hz added together, the same signal in both ears. Sixteen adults heard each of four 8-minute conditions (7 Hz and 40 Hz, binaural and monaural) during EEG. Both beat types entrained cortical activity at the beat frequency, monaural beats more strongly; ratings of mental relaxation and absorption did not differ between conditions."
adaptation = "The source added the two tones, halved the sum and RMS-normalized both stimulus types. Here each tone's peak is 3.01 dB below -20 dBFS, so each ear has the unfaded plateau RMS of the binaural condition's -20 dBFS tone; the per-ear summed peak bound is -16.99 dBFS. Both tones start at phase zero. The source generated sound live at 48 kHz and calibrated output to 70 dB SPL per ear; it does not specify ramps; this preset is uncalibrated and adds 0.1 s fades."

