population_detail = "Mouse study: Comparison sound in Alzheimer's research"
condition_role = "comparison"
measures = ["behavior", "other"]
methods_locator = "Auditory stimulation condition: 1 ms tones of 10 kHz repeated at 80 Hz. Mice of Alzheimer's disease models heard 1 ms tones of 10 kHz at 60 dB from loudspeakers above their chamber for 1 hour a day for 7 days, at 40 Hz or, as controls, at 8 Hz, 80 Hz or random intervals. In 5XFAD mice the 40 Hz trains reduced soluble amyloid-beta and plaques in auditory cortex and hippocampus and improved recognition and spatial memory; 8 Hz, 80 Hz and random trains did not significantly change amyloid-beta levels."
summary = "Very short 10 kHz beeps, 80 per second. In mice bred to develop Alzheimer's-like changes, 7 mice heard this comparison sound for one hour a day for a week. Their amyloid levels did not significantly differ from the 19 mice hearing no stimulation; the 40-per-second group had lower levels. Memory was not tested for the 80-per-second condition. These are mouse findings, and the sound is not an established treatment."
adaptation = "The source states 1 ms tones of 10 kHz at 80 Hz (8% of each period) at 60 dB from loudspeakers, without ramps, phase or sample rate. Here a continuous 10 kHz tone starting at phase zero is gated open for the first 1 ms of each period, identical in both ears, with a -20 dBFS peak, uncalibrated, and 0.1 s fades added. The random-interval control is not reproduced."
