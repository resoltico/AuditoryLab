population_detail = "Human study: Dementia research"
condition_role = "test"
measures = ["eeg"]
methods_locator = "One sound trial: a 5 kHz tone amplitude-modulated by a 40 Hz rectangular wave with a 4% duty cycle, 1 ms on in each 25 ms. Thirty-five adults aged 54 to 89 with memory complaints were recruited, and 33 were analyzed after two diagnostic exclusions; the analyzed participants were grouped as normal, mild cognitive impairment or Alzheimer's disease. Participants heard 6 or 10 trials of 40 s separated by 20 s of silence from two loudspeakers 50 cm in front of them during EEG. Phase locking between frontal and parietal sites increased during stimulation compared with rest."
summary = "A 5 kHz beep 40 times a second, each beep 1 ms long: a high buzz. One session recruited 35 older adults with memory complaints, some with dementia; 33 were included in the analysis. They heard 40-second stretches from loudspeakers. Brain recordings showed a group response at 40 Hz and stronger synchronization between front and back regions during sound, with responses varying between people. The study did not test memory or treatment effects. It is not an established treatment."
adaptation = "The source generated the sound in MATLAB as a WAV file, played it from two loudspeakers, and reports around -40 dB without specifying the reference. Participants adjusted the level for comfort; the source states no phase, ramps or sample rate. Here a continuous 5 kHz tone starting at phase zero is gated open for the first 1 ms of each 25 ms period, identical in both ears, with a -20 dBFS peak, uncalibrated, and 0.1 s fades added. This recipe is one 40 s trial; the silent intervals and the trial sequence are not part of it."
