schema_version = 2
duration_seconds = 300.0
fade_seconds = 0.1

[about]
title = "15 Hz binaural beat"
studied_for = "Human study: Visual working memory"
summary = "Two steady low tones, 255 Hz in the left ear and 240 Hz in the right, which the brain hears as a 15-per-second pulsing (a binaural beat); use headphones. In one study, 28 adults heard it for 5 minutes during a visual memory task, and their accuracy improved slightly, and this was the only sound in the study with an accuracy increase. Reaction times did not differ significantly between the study's sounds. Reviews of binaural-beat research report mixed results."
citation = "Beauchene C, Abaid N, Moran R, Diana RA, Leonessa A (2016). The effect of binaural beats on visuospatial working memory and cortical connectivity. PLoS ONE 11(11): e0166630."
source_url = "https://doi.org/10.1371/journal.pone.0166630"
study = "Binaural-beat condition: 240 Hz in the right ear and 255 Hz in the left. One of six 5-minute sound conditions played in random order while 28 adults did a visuospatial working-memory task during EEG. Accuracy rose during the 15 Hz binaural beat and fell during the other conditions."
adaptation = "The source generated the tones in MATLAB and let participants set the volume; it states no phase, ramps or sample rate. Tones start at phase zero with a -20 dBFS peak, uncalibrated, with 0.1 s fades added."

[[component]]
ears = "left"
kind = "tone"
frequency_hz = 255.0
peak_dbfs = -20.0

[[component]]
ears = "right"
kind = "tone"
frequency_hz = 240.0
peak_dbfs = -20.0
