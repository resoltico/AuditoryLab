population_detail = "Human study: Hearing measurement"
condition_role = "test"
measures = ["hearing", "eeg"]
methods_locator = "A 2000 Hz tone, 100% sinusoidally amplitude-modulated at 39.0625 Hz, presented to one ear for 307.2 s to 19 of the study's 38 normal-hearing adults, who heard the 500 Hz and 2000 Hz carriers while watching a silent subtitled film during EEG. The study measured 40 Hz auditory steady-state responses at levels from 40 to 80 dB SPL to predict the level balance between the ears; 39.0625 Hz gives each 1.024 s analysis epoch a whole number of modulation periods."
summary = "A 2000 Hz tone that swells and fades about 40 times a second, in the left ear only. In a study of 38 young adults with normal hearing, 19 heard this carrier while researchers compared brain-recording estimates of equal loudness between ears with listeners' judgments. Across the study's carriers, sound levels and electrode selections, estimates were within 5 dB of those judgments in 59% of cases and within 10 dB in 85%; some individual errors were larger. These aggregate results do not establish accuracy for this carrier alone. This was hearing-measurement research, not a study of wellbeing."
limitations = "Source findings concern the stated population and condition; adaptations do not establish efficacy for generated audio. See the summary and adaptation for study-specific limitations."
adaptation = "The study stimulated the left and right ears in alternation at several calibrated levels with a 96 kHz signal sampling rate; this recipe is the left ear with a -20 dBFS peak, uncalibrated, and changing ears to right gives the other ear. The study states no modulation formula, phase or ramps: here tone and modulator start at phase zero, the envelope is (1 + sin)/2, and 0.1 s fades are added."
