[[evidence]]
source = "ioannou-2015"
scope = "reference_condition"
population = "human"
population_detail = "Human study: Brain-rhythm response"
condition_role = "test"
measures = ["eeg"]
methods_locator = "The binaural minute of the 20 Hz block: 200 Hz in the left ear and 220 Hz in the right. Sixteen musicians and sixteen non-musicians watched a silent subtitled film during EEG while 34 blocks played, each 20 s of silence, 1 minute of 200 Hz in both ears, then 1 minute of a binaural beat from 1 to 48 Hz. Beats in the alpha band, 9 to 12 Hz, gave the strongest steady-state responses."
summary = "200 Hz in the left ear and 220 Hz in the right, heard through headphones as a 20-per-second binaural beat. In one study, 32 adults, half of them musicians, listened while watching a silent film; their brain recordings followed beats near 10 per second most strongly. The study measured brain responses, not effects such as relaxation or focus. Reviews of binaural-beat research report mixed results."
adaptation = "Volume was set by each participant; the source states no phase, ramps or sample rate. Tones start at phase zero with a -20 dBFS peak, uncalibrated, with 0.1 s fades added. The silent interval and the block sequence are not part of this recipe. The source's other blocks differ only in the right ear's frequency, 200 Hz plus the beat frequency."
