schema_version = 1
duration_seconds = 180.0
fade_seconds = 0.1

[provenance]
title = "40 Hz clicks"
citation = "Chan D, Suk HJ, Jackson BL, Milman NP, Stark D, Klerman EB, et al. (2022). Gamma frequency sensory stimulation in mild probable Alzheimer's dementia patients: results of feasibility and pilot studies. PLoS ONE 17(12): e0278412."
source_url = "https://doi.org/10.1371/journal.pone.0278412"
description = "The sound of a 40 Hz light-and-sound stimulation device: a 1 ms rectangular pulse in every 25 ms. In the study's EEG sessions, sound-only, light-only and combined conditions each lasted about 3 minutes for cognitively normal adults. Its pilot trial's home-use arm combined the sound with 40 Hz light for 1 hour a day, against constant light and white noise."
adaptation = "The source played the clicks from loudspeakers about five feet away at 68 to 78 dB; this preset sends identical clicks to both ears at a -20 dBFS pulse height, uncalibrated, for 3 minutes, with 0.1 s fades added. Pulse polarity is not stated; these pulses are positive. The light stimulation is not reproduced."

[[component]]
ears = "both"
kind = "click"
rate_hz = 40.0
width_seconds = 0.001
level_dbfs = -20.0
