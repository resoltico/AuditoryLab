schema_version = 1
duration_seconds = 1800.0
fade_seconds = 0.1

[provenance]
title = "6 Hz binaural beat"
citation = "Jirakittayakorn N, Wongsawat Y (2017). Brain responses to a 6-Hz binaural beat: effects on general theta rhythm and frontal midline theta activity. Frontiers in Neuroscience 11: 365."
source_url = "https://doi.org/10.3389/fnins.2017.00365"
description = "A 30-minute binaural beat, 250 Hz in the left ear and 256 Hz in the right, heard by 17 seated adults between 5-minute baseline and post-stimulus EEG recordings; a control group of 11 heard silence. Theta activity increased within 10 minutes of exposure in the beat group."
adaptation = "The source made the stimulus in Sound Forge Pro and played it at 65 dB SPL; it states no phase, ramps or sample rate. Tones start at phase zero at -20 dBFS, uncalibrated, with 0.1 s fades added. The baseline and post-stimulus periods are not part of this preset."

[[component]]
ears = "left"
kind = "tone"
frequency_hz = 250.0
level_dbfs = -20.0

[[component]]
ears = "right"
kind = "tone"
frequency_hz = 256.0
level_dbfs = -20.0
