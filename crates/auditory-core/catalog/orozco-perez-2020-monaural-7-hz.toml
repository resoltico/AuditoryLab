[provenance]
title = "7 Hz monaural beat"
citation = "Orozco Perez HD, Dumas G, Lehmann A (2020). Binaural beats through the auditory pathway: from brainstem to connectivity patterns. eNeuro 7(2): ENEURO.0232-19.2020."
source_url = "https://doi.org/10.1523/ENEURO.0232-19.2020"
description = "Monaural-beat control for the 7 Hz binaural condition: 396.5 Hz and 403.5 Hz added together, the same signal in both ears. Sixteen adults heard each of four 8-minute conditions (7 Hz and 40 Hz, binaural and monaural) during EEG. Both beat types entrained cortical activity at the beat frequency, monaural beats more strongly; ratings of mental relaxation and absorption did not differ between conditions."
adaptation = "The source added the two tones, halved the sum and RMS-normalized both stimulus types. Here each tone is 3.01 dB below -20 dBFS, so each ear has the unfaded plateau RMS of the binaural condition's -20 dBFS tone; the per-ear summed-peak bound is -16.99 dBFS. Both tones start at phase zero. The Stimuli section gives 396.5 Hz and the FFR analysis 397.5 Hz; this preset uses 396.5 Hz, which gives the stated 7 Hz difference. The source generated sound live at 48 kHz and calibrated output to 70 dB SPL per ear; it does not specify ramps; this preset is uncalibrated and adds 0.1 s fades."

[[component]]
ears = "both"
kind = "tone"
frequency_hz = 396.5
level_dbfs = -23.0103

