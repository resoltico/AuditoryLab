schema_version = 1
duration_seconds = 60.0
fade_seconds = 0.1

[provenance]
title = "10 Hz binaural beat"
citation = "Ioannou CI, Pereda E, Lindsen JP, Bhattacharya J (2015). Electrical brain responses to an auditory illusion and the impact of musical expertise. PLoS ONE 10(6): e0129486."
source_url = "https://doi.org/10.1371/journal.pone.0129486"
description = "The binaural minute of the 10 Hz block: 200 Hz in the left ear and 210 Hz in the right. Sixteen musicians and sixteen non-musicians watched a silent subtitled film during EEG while 34 blocks played, each 20 s of silence, 1 minute of 200 Hz in both ears, then 1 minute of a binaural beat from 1 to 48 Hz. Beats in the alpha band, 9 to 12 Hz, gave the strongest steady-state responses."
adaptation = "Volume was set by each participant; the source states no phase, ramps or sample rate. Tones start at phase zero at -20 dBFS, uncalibrated, with 0.1 s fades added. The silent interval and the block sequence are not part of this preset. The source's other blocks differ only in the right ear's frequency, 200 Hz plus the beat frequency."

[[component]]
ears = "left"
kind = "tone"
frequency_hz = 200.0
level_dbfs = -20.0

[[component]]
ears = "right"
kind = "tone"
frequency_hz = 210.0
level_dbfs = -20.0
