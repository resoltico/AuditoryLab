<style>
#rhythm-spectrum-review [data-art] { display:block; width:100%; height:auto; }
</style>
<script>
(() => {
  const root=document.getElementById('rhythm-spectrum-review');
  const select=root.querySelector('select');
  const saved=window.openai?.widgetState?.privateContent;
  let appearance=['dark','light','system'].includes(saved?.appearance)?saved.appearance:'dark';
  let revision=Number(saved?.revision)||0;
  const media=matchMedia('(prefers-color-scheme: dark)');
  function render(){
    select.value=appearance;
    const theme=appearance==='system'?(media.matches?'dark':'light'):appearance;
    root.querySelectorAll('[data-art]').forEach(img=>{img.src=img.dataset[theme];});
  }
  select.addEventListener('change',()=>{
    appearance=select.value;revision+=1;render();
    if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{illustrationAppearance:appearance},privateContent:{appearance,revision}}).catch(()=>{});
  });
  media.addEventListener('change',render);
  window.addEventListener('openai:set_globals',event=>{
    const next=event.detail?.globals?.widgetState?.privateContent;
    if(!['dark','light','system'].includes(next?.appearance)||(Number(next.revision)||0)<=revision)return;
    appearance=next.appearance;revision=Number(next.revision)||0;render();
  });
  render();
})();
</script>
