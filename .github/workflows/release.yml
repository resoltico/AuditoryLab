name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching Cargo.toml and a dated CHANGELOG.md section
        required: true
        type: string
      publish:
        description: Publish the verified release (false only uploads verification artifacts)
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
env:
  RELEASE_VERSION: ${{ inputs.version }}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir -p target/tmp
          echo "TMPDIR=${GITHUB_WORKSPACE}/target/tmp" >> "$GITHUB_ENV"
      - run: rustup toolchain install
      - name: Check ref, version, notes and absent tag
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$PUBLISH" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]]
          fi
          cargo xtask check-release "$RELEASE_VERSION"
          existing="$(git ls-remote --tags origin "refs/tags/v${RELEASE_VERSION}")"
          if [[ -n "$existing" ]]; then
            echo "Tag v${RELEASE_VERSION} already exists; published tags and assets are never replaced." >&2
            exit 1
          fi
  build:
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      source-revision: ${{ github.sha }}
    permissions:
      contents: read
  prepare:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir -p target/tmp
          echo "TMPDIR=${GITHUB_WORKSPACE}/target/tmp" >> "$GITHUB_ENV"
      - run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: target/assets
          merge-multiple: true
          digest-mismatch: error
      - name: Write checksums and release notes
        run: |
          (cd target/assets && sha256sum -- * > SHA256SUMS)
          cargo xtask notes "$RELEASE_VERSION" > target/notes.md
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/assets/*
      - name: Verify checksums and provenance
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" target/provenance.jsonl
          (cd target/assets && sha256sum --check SHA256SUMS)
          for asset in target/assets/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --bundle target/provenance.jsonl \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF"
          done
      - name: Upload verification bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification
          path: |
            target/assets/*
            target/notes.md
            target/provenance.jsonl
          if-no-files-found: error
          compression-level: 0
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare temporary directory
        run: |
          mkdir -p target/tmp
          echo "TMPDIR=${GITHUB_WORKSPACE}/target/tmp" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-verification
          path: target
          digest-mismatch: error
      - name: Verify downloaded checksums
        run: (cd target/assets && sha256sum --check SHA256SUMS)
      - name: Create draft, compare uploaded bytes, then publish
        run: |
          tag="v${RELEASE_VERSION}"
          existing="$(git ls-remote --tags origin "refs/tags/${tag}")"
          if [[ -n "$existing" ]]; then
            echo "Tag ${tag} already exists; published tags and assets are never replaced." >&2
            exit 1
          fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" \
            --notes-file target/notes.md target/assets/*
          gh release view "$tag" --json assets \
            --jq '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' | sort > target/uploaded-digests
          (cd target/assets && sha256sum -- *) | sort > target/built-digests
          diff target/built-digests target/uploaded-digests
          gh release edit "$tag" --draft=false --latest
