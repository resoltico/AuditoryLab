name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching Cargo.toml and a dated CHANGELOG.md section
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
env:
  RELEASE_VERSION: ${{ inputs.version }}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir -p target/tmp
          echo "TMPDIR=${GITHUB_WORKSPACE}/target/tmp" >> "$GITHUB_ENV"
      - run: rustup toolchain install
      - name: Check main, version, notes and absent tag
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          cargo xtask check-release "$RELEASE_VERSION"
          existing="$(git ls-remote --tags origin "refs/tags/v${RELEASE_VERSION}")"
          if [[ -n "$existing" ]]; then
            echo "Tag v${RELEASE_VERSION} already exists; published tags and assets are never replaced." >&2
            exit 1
          fi
  build:
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      source-revision: ${{ github.sha }}
    permissions:
      contents: read
  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir -p target/tmp
          echo "TMPDIR=${GITHUB_WORKSPACE}/target/tmp" >> "$GITHUB_ENV"
      - run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: target/assets
          merge-multiple: true
          digest-mismatch: error
      - name: Write checksums and release notes
        run: |
          (cd target/assets && sha256sum -- * > SHA256SUMS)
          cargo xtask notes "$RELEASE_VERSION" > target/notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/assets/*
      - name: Create draft, compare uploaded bytes, then publish
        run: |
          tag="v${RELEASE_VERSION}"
          existing="$(git ls-remote --tags origin "refs/tags/${tag}")"
          if [[ -n "$existing" ]]; then
            echo "Tag ${tag} already exists; published tags and assets are never replaced." >&2
            exit 1
          fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" \
            --notes-file target/notes.md target/assets/*
          gh release view "$tag" --json assets \
            --jq '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' | sort > target/uploaded-digests
          (cd target/assets && sha256sum -- *) | sort > target/built-digests
          diff target/built-digests target/uploaded-digests
          gh release edit "$tag" --draft=false --latest
