name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching Cargo.toml and a dated CHANGELOG.md section
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  prepare:
    name: Check the release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source: ${{ steps.identity.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Initialize owned job temporary output
        run: |
          python3 - <<'PYINIT'
          import os
          from pathlib import Path
          temporary = Path.cwd() / "target" / "job-temp"
          temporary.mkdir(parents=True, exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name in ("TMPDIR", "TEMP", "TMP"):
                  output.write(f"{name}={temporary}\n")
          PYINIT
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Require main at the dispatched commit, the version and its notes
        id: identity
        run: |
          [[ "${GITHUB_REF}" == refs/heads/main ]]
          source="$(python scripts/release.py check --version "${RELEASE_VERSION}")"
          [[ "${source}" == "${GITHUB_SHA}" ]]
          tag="v${RELEASE_VERSION}"
          existing="$(git ls-remote --tags origin "refs/tags/${tag}")"
          if [[ -n "${existing}" ]]; then
            echo "Tag ${tag} already exists; releases are never replaced." >&2
            exit 1
          fi
          echo "source=${source}" >> "${GITHUB_OUTPUT}"

  quality:
    name: Quality gates
    needs: prepare
    uses: ./.github/workflows/quality.yml
    with:
      skip-native: true
    permissions:
      contents: read

  build:
    name: Qualify release artifacts
    needs: prepare
    uses: ./.github/workflows/native.yml
    with:
      build-kind: release
    permissions:
      contents: read

  publish:
    name: Publish the release
    needs: [prepare, quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SOURCE: ${{ needs.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - name: Initialize owned job temporary output
        run: |
          python3 - <<'PYINIT'
          import os
          from pathlib import Path
          temporary = Path.cwd() / "target" / "job-temp"
          temporary.mkdir(parents=True, exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name in ("TMPDIR", "TEMP", "TMP"):
                  output.write(f"{name}={temporary}\n")
          PYINIT
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: target/downloads
          digest-mismatch: error
      - name: Validate assigned artifacts before flattening
        run: python3 scripts/release.py validate-artifacts --directory target/downloads --version "${RELEASE_VERSION}" --source-revision "${RELEASE_SOURCE}"
      - name: Flatten validated archives
        run: |
          mkdir target/assets
          mv target/downloads/release-*/* target/assets/
      - name: Attest the qualified archives without rebuilding
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/assets/*
          create-storage-record: false
      - name: Write checksums and notes
        run: |
          (cd target/assets && sha256sum -- * > SHA256SUMS)
          python3 scripts/release.py notes --version "${RELEASE_VERSION}" > "${PWD}/target/job-temp/notes.md"
      - name: Publish a release whose uploaded assets match the built ones
        run: |
          tag="v${RELEASE_VERSION}"
          existing="$(git ls-remote --tags origin "refs/tags/${tag}")"
          if [[ -n "${existing}" ]]; then
            echo "Tag ${tag} already exists; releases are never replaced." >&2
            exit 1
          fi
          gh release create "${tag}" --draft --target "${RELEASE_SOURCE}" --title "${tag}" \
            --notes-file "${PWD}/target/job-temp/notes.md" target/assets/*
          gh release view "${tag}" --json assets \
            --jq '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' | sort > "${PWD}/target/job-temp/uploaded"
          (cd target/assets && sha256sum -- *) | sort > "${PWD}/target/job-temp/built"
          diff "${PWD}/target/job-temp/built" "${PWD}/target/job-temp/uploaded"
          gh release edit "${tag}" --draft=false --latest
