name: Controlled callback qualification
on:
  workflow_dispatch:
    inputs:
      maximum-budget-percent:
        description: Maximum callback cost as a percentage of its nominal buffer deadline
        required: true
        default: '75'
permissions:
  contents: read
jobs:
  callbacks:
    # Dedicated, idle hardware with a recorded CPU/power configuration.
    runs-on: [self-hosted, auditorylab-performance]
    timeout-minutes: 30
    env:
      AUDITORYLAB_PERF_MAX_BUDGET_PERCENT: ${{ inputs.maximum-budget-percent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare
        shell: bash
        run: |
          mkdir -p target/tmp target/qualification
          echo "TMPDIR=${GITHUB_WORKSPACE}/target/tmp" >> "$GITHUB_ENV"
          rustup toolchain install
          rustc -Vv > target/qualification/environment.txt
          cargo -V >> target/qualification/environment.txt
          echo "Runner: $RUNNER_OS $RUNNER_ARCH $RUNNER_NAME" >> target/qualification/environment.txt
      - name: Build before timing
        run: cargo test --locked -p auditorylab --features device-playback --release --no-run
      - name: Qualify callbacks
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p auditorylab --features device-playback callback_monitor_costs --release -- --ignored --nocapture 2>&1 | tee target/qualification/callbacks.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: controlled-callback-qualification
          path: target/qualification
