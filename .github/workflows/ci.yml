name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_call:
    inputs:
      release:
        description: Run the full release qualification, including scoped mutations
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Release qualification must not be cancelled by a later ordinary CI run.
  cancel-in-progress: ${{ !inputs.release }}
env:
  RUST_BACKTRACE: '1'
  AUDITORYLAB_SOURCE_REVISION: ${{ github.sha }}
  MACOS_XCODE_VERSION: '26.3'
  CARGO_DENY_VERSION: '0.20.2'
  CARGO_ABOUT_VERSION: '0.9.3'
  CARGO_MUTANTS_VERSION: '27.1.0'
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_LINUX_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  CARGO_HOME: ${{ github.workspace }}/target/cargo-home
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      core-changed: ${{ steps.changes.outputs.core-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare temporary directory
        run: |
          mkdir -p target/tmp
          echo "TMPDIR=${GITHUB_WORKSPACE}/target/tmp" >> "$GITHUB_ENV"
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
      - name: Verify editable onboarding artwork and sine examples
        if: github.event_name != 'schedule'
        run: python3 artwork/onboarding/verify_art.py --scratch target/onboarding-art-qa
      - run: rustup toolchain install
      - name: Install Linux build prerequisites
        if: github.event_name != 'schedule'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libasound2-dev libfontconfig1-dev libglib2.0-bin libxkbcommon-x11-0
      - name: Read resolved Slint formatter version
        if: github.event_name != 'schedule'
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_ENV"
          import tomllib
          with open("Cargo.lock", "rb") as source:
              lock = tomllib.load(source)
          versions = [p["version"] for p in lock["package"] if p["name"] == "slint"]
          assert len(versions) == 1, "one resolved Slint version is required"
          print("SLINT_LSP_VERSION=" + versions[0])
          PYTHON
      - name: Cache Slint formatter
        if: github.event_name != 'schedule'
        id: slint-format-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CARGO_HOME }}/bin/slint-lsp
          key: slint-lsp-${{ runner.os }}-${{ runner.arch }}-${{ env.SLINT_LSP_VERSION }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}
      - name: Install Slint formatter
        if: github.event_name != 'schedule' && steps.slint-format-cache.outputs.cache-hit != 'true'
        run: cargo install slint-lsp --version "=$SLINT_LSP_VERSION" --locked --no-default-features
      - if: github.event_name != 'schedule'
        run: cargo fmt --all -- --check
      - if: github.event_name != 'schedule'
        run: cargo xtask check-style
      - name: Validate GitHub workflows
        if: github.event_name != 'schedule'
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "target/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_LINUX_SHA256  target/$archive" | sha256sum --check
          tar -xzf "target/$archive" -C target actionlint
          target/actionlint
      - name: Verify supported target consistency
        if: github.event_name != 'schedule'
        run: |
          cargo xtask check-targets
          python3 .github/qualification.py --test
      - name: Verify maintained dependency patches and target graphs
        if: github.event_name != 'schedule'
        run: cargo xtask verify-vendor
      - name: Verify patched build executor
        if: github.event_name != 'schedule'
        # Cargo 1.99.1 panics when selecting this build-only dependency's tests.
        # This no_std crate has no dependencies; use the pinned compiler directly.
        run: |
          rustc --edition=2018 --test third_party/spin_on/src/lib.rs -o target/debug/spin_on-tests
          target/debug/spin_on-tests
      - name: Cache cargo-deny
        id: deny-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CARGO_HOME }}/bin/cargo-deny
          key: cargo-deny-release-locked-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_DENY_VERSION }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}
      - name: Install cargo-deny
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
      - name: Weekly advisory check
        if: github.event_name == 'schedule'
        run: cargo deny check advisories
      - if: github.event_name != 'schedule'
        run: cargo deny check
      - name: Detect core source changes
        id: changes
        if: github.event_name != 'schedule' && !inputs.release
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          base="$BASE_REVISION"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$base" HEAD -- crates/core Cargo.toml Cargo.lock rust-toolchain.toml .cargo .github/workflows/ci.yml > target/core-changes.txt
          if [[ -s target/core-changes.txt ]]; then
            echo 'core-changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'core-changed=false' >> "$GITHUB_OUTPUT"
          fi
  domain:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir -p target/tmp
          echo "TMPDIR=${GITHUB_WORKSPACE}/target/tmp" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libasound2-dev
      - run: rustup toolchain install
      - name: Domain and application state checks without building the desktop
        run: cargo test -p auditorylab-core -p auditorylab-app --lib --locked
  icons:
    if: github.event_name != 'schedule'
    # Xcode's layered icon renderer needs Tahoe frameworks. Product binaries
    # and extracted archives are still built/tested on macOS 15, including Intel.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare native icon compiler
        run: |
          mkdir -p target/tmp
          echo "TMPDIR=${GITHUB_WORKSPACE}/target/tmp" >> "$GITHUB_ENV"
          developer="/Applications/Xcode_${MACOS_XCODE_VERSION}.app/Contents/Developer"
          test -d "$developer"
          echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
      - run: rustup toolchain install
      - run: cargo xtask compile-icons target/macos-icons
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-icons-${{ github.sha }}
          path: target/macos-icons/*
          if-no-files-found: error
  matrix:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.matrix.outputs.native }}
      macos: ${{ steps.matrix.outputs.macos }}
      other: ${{ steps.matrix.outputs.other }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open('.github/native-targets.json'))
          print('native=' + json.dumps(data))
          for key, mac in [('macos', True), ('other', False)]:
              print(key + '=' + json.dumps({'include': [x for x in data['include'] if x['platform'].startswith('macos-') == mac]}))
          PYTHON
  native:
    needs: matrix
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.native) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare temporary directory
        run: |
          mkdir -p target/tmp
          for name in TMPDIR TMP TEMP; do
            echo "${name}=${GITHUB_WORKSPACE}/target/tmp" >> "$GITHUB_ENV"
          done
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libasound2-dev libfontconfig1-dev libglib2.0-bin libxkbcommon-x11-0
      - run: rustup toolchain install
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check callback median cost
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        run: cargo test -p auditorylab-app --profile dist --locked callback_cost -- --ignored --nocapture
      - run: cargo test -p auditorylab-app --test library_process --locked
      - name: Verify native AT-SPI cache signal contracts
        if: runner.os == 'Linux'
        run: cargo test -p accesskit_unix --lib --locked
      - name: Verify macOS termination request contracts
        if: runner.os == 'macOS'
        env:
          CARGO_TARGET_DIR: target/vendor-tests
        run: cargo test --manifest-path third_party/winit/Cargo.toml --locked --lib termination
      - name: Verify native UIA typed selection arrays and COM ownership
        if: runner.os == 'Windows'
        env:
          CARGO_TARGET_DIR: target/vendor-tests
        run: cargo test --manifest-path third_party/accesskit_windows/Cargo.toml --locked --lib selection_tests
      - run: cargo test -p auditorylab-core --release --locked
      - name: Documentation warnings
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: '-D warnings'
  package:
    needs: matrix
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.other) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare temporary directory
        run: |
          mkdir -p target/tmp
          for name in TMPDIR TMP TEMP; do
            echo "${name}=${GITHUB_WORKSPACE}/target/tmp" >> "$GITHUB_ENV"
          done
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libasound2-dev libfontconfig1-dev libglib2.0-bin libxkbcommon-x11-0
      - run: rustup toolchain install
      - name: Select icon-capable Xcode
        if: runner.os == 'macOS'
        run: |
          developer="/Applications/Xcode_${MACOS_XCODE_VERSION}.app/Contents/Developer"
          test -d "$developer"
          echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
      - name: Cache cargo-about
        id: about-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CARGO_HOME }}/bin/cargo-about${{ runner.os == 'Windows' && '.exe' || '' }}
          key: cargo-about-cli-release-locked-${{ matrix.runner }}-${{ runner.arch }}-${{ env.CARGO_ABOUT_VERSION }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}
      - name: Install cargo-about
        if: steps.about-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version "$CARGO_ABOUT_VERSION" --locked --features cli
      - name: Download native icon resources for this source
        if: runner.os == 'macOS'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-icons-${{ github.sha }}
          path: target/macos-icons
          digest-mismatch: error
      # Package inspection also reads both Windows executables through VersionInfo.
      - name: Build archives and run host smoke tests
        env:
          DIST_TARGET: ${{ matrix.target }}
        run: |
          args=(--target "$DIST_TARGET")
          if [[ "$RUNNER_OS" == macOS ]]; then
            args+=(--icons target/macos-icons)
          fi
          cargo xtask dist "${args[@]}"
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
          if-no-files-found: error
          compression-level: 0
  package-macos:
    needs: [matrix, icons]
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.macos) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare temporary directory
        run: |
          mkdir -p target/tmp
          for name in TMPDIR TMP TEMP; do
            echo "${name}=${GITHUB_WORKSPACE}/target/tmp" >> "$GITHUB_ENV"
          done
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libasound2-dev libfontconfig1-dev libglib2.0-bin libxkbcommon-x11-0
      - run: rustup toolchain install
      - name: Select icon-capable Xcode
        if: runner.os == 'macOS'
        run: |
          developer="/Applications/Xcode_${MACOS_XCODE_VERSION}.app/Contents/Developer"
          test -d "$developer"
          echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
      - name: Cache cargo-about
        id: about-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CARGO_HOME }}/bin/cargo-about${{ runner.os == 'Windows' && '.exe' || '' }}
          key: cargo-about-cli-release-locked-${{ matrix.runner }}-${{ runner.arch }}-${{ env.CARGO_ABOUT_VERSION }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}
      - name: Install cargo-about
        if: steps.about-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version "$CARGO_ABOUT_VERSION" --locked --features cli
      - name: Download native icon resources for this source
        if: runner.os == 'macOS'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-icons-${{ github.sha }}
          path: target/macos-icons
          digest-mismatch: error
      # Package inspection also reads both Windows executables through VersionInfo.
      - name: Build archives and run host smoke tests
        env:
          DIST_TARGET: ${{ matrix.target }}
        run: |
          args=(--target "$DIST_TARGET")
          if [[ "$RUNNER_OS" == macOS ]]; then
            args+=(--icons target/macos-icons)
          fi
          cargo xtask dist "${args[@]}"
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
          if-no-files-found: error
          compression-level: 0
  mutation:
    name: mutation (${{ matrix.source }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # Split the larger selections without dropping mutants. Each runner
        # keeps one worker/build directory, rather than competing for disk/CPU.
        include:
          - source: render/synthesis
            shard: 0/12
          - source: render/synthesis
            shard: 1/12
          - source: render/synthesis
            shard: 2/12
          - source: render/synthesis
            shard: 3/12
          - source: render/synthesis
            shard: 4/12
          - source: render/synthesis
            shard: 5/12
          - source: render/synthesis
            shard: 6/12
          - source: render/synthesis
            shard: 7/12
          - source: render/synthesis
            shard: 8/12
          - source: render/synthesis
            shard: 9/12
          - source: render/synthesis
            shard: 10/12
          - source: render/synthesis
            shard: 11/12
          - source: render/live
            shard: 0/2
          - source: render/live
            shard: 1/2
          - source: analysis/timing
            shard: 0/3
          - source: analysis/timing
            shard: 1/3
          - source: analysis/timing
            shard: 2/3
          - source: model/authored
            shard: 0/2
          - source: model/authored
            shard: 1/2
          - source: render/compiled
            shard: 0/1
          - source: analysis/facts
            shard: 0/1
          - source: analysis/rhythm
            shard: 0/3
          - source: analysis/rhythm
            shard: 1/3
          - source: analysis/rhythm
            shard: 2/3
          - source: model/validity
            shard: 0/1
          - source: model/finite
            shard: 0/1
          - source: model/catalog_id
            shard: 0/1
          - source: render/source
            shard: 0/1
          - source: model/pulse
            shard: 0/1
          - source: model/modulation
            shard: 0/1
          - source: model/component_codec
            shard: 0/1
          - source: model/table_fields
            shard: 0/1
          - source: render/pulse
            shard: 0/1
          - source: render/finite_source
            shard: 0/1
          - source: render/waveform
            shard: 0/1
          - source: measurement/accumulate
            shard: 0/1
    needs: lint
    if: github.event_name != 'schedule' && (inputs.release || needs.lint.outputs.core-changed == 'true')
    runs-on: ubuntu-24.04
    # Core now includes numerical measurement tests. Keep every mutant and the
    # 60-second per-mutant limit; allow the full single-worker cohort to finish.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir -p target/tmp
          echo "TMPDIR=${GITHUB_WORKSPACE}/target/tmp" >> "$GITHUB_ENV"
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install
      - name: Cache cargo-mutants
        id: mutants-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CARGO_HOME }}/bin/cargo-mutants
          key: cargo-mutants-release-locked-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_MUTANTS_VERSION }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}
      - name: Install cargo-mutants
        if: steps.mutants-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-mutants --version "$CARGO_MUTANTS_VERSION" --locked
      - name: Mutate one core source file
        env:
          MUTATION_SOURCE: ${{ matrix.source }}
          MUTATION_SHARD: ${{ matrix.shard }}
        run: |
          args=(--file "crates/core/src/${MUTATION_SOURCE}.rs" --package auditorylab-core
                --test-workspace=false --jobs 1 --shard "$MUTATION_SHARD"
                --timeout 60 --cargo-arg=--locked --output target/mutations)
          if [[ "$MUTATION_SOURCE" == render/synthesis ]]; then
            # Bit 52 is clear in the fraction; OR and XOR are equivalent.
            # The times_at_most enclosing != guard excludes equality.
            # Operator/function exclusions keep the other guards mutated.
            args+=(--exclude-re 'replace \| with \^ in parts$'
                   --exclude-re 'replace < with <= in times_at_most$')
          fi
          if [[ "$MUTATION_SOURCE" == render/live ]]; then
            # Silent sources yield +0.0 with or without the shared gain; the
            # guard only skips that work. Extra ramp snapshots are overwritten
            # by the call's final one; the other && in render is a let chain.
            args+=(--exclude-re 'replace match guard silent with false in Slot::frame$'
                   --exclude-re 'replace && with \|\| in Engine::render$')
          fi
          if [[ "$MUTATION_SOURCE" == render/finite_source ]]; then
            # Reachable non-ended sources have cursor < total; ended sources are
            # rejected by the preceding !self.ended guard in begin_buffer.
            args+=(--exclude-re 'replace < with <= in FiniteSource::begin_buffer$')
          fi
          if [[ "$MUTATION_SOURCE" == measurement/accumulate ]]; then
            # Locally qualified push/finish guards cover malformed frames and extent;
            # pair/silence controls also protect channel-coincidence predicates.
            args+=(--re '(replace (\|\||!=|>=|<)|delete !) .*Measurement::(push|finish)$')
          fi
          cargo mutants "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: core-${{ strategy.job-index }}-mutations
          path: target/mutations/mutants.out/
          if-no-files-found: error
  native-graphical-linux:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        session: [x11, wayland]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libasound2-dev libfontconfig1-dev libglib2.0-bin libxkbcommon-x11-0 libgl1-mesa-dri libegl1-mesa-dev xvfb xauth x11-utils xdotool openbox sway wayland-utils dbus-x11 at-spi2-core python3-pyatspi python3-pil xdg-desktop-portal xdg-desktop-portal-gtk ripgrep
          mkdir -p target/tmp target/native-${{ matrix.session }}
      - name: Prepare isolated temporary files
        shell: bash
        run: |
          mkdir -p target/tmp
          for name in TMPDIR TMP TEMP; do
            echo "${name}=${GITHUB_WORKSPACE}/target/tmp" >> "$GITHUB_ENV"
          done
      - run: rustup toolchain install
      - run: cargo build -p auditorylab-gui -p auditorylab-cli --locked
      - name: Production native provider, keys, and portal parent qualification
        timeout-minutes: 5
        run: |
          scratch="$PWD/target/native-${{ matrix.session }}"
          target/debug/auditorylab --library-dir "$scratch/library" library init
          timeout 240s dbus-run-session -- xvfb-run --auto-servernum --server-args='-screen 0 1920x1200x24 +extension GLX' bash crates/gui/native/linux-session.sh '${{ matrix.session }}' "$PWD/target/debug/auditorylab-gui" "$PWD/crates/core/tests/fixtures/recipes/custom-derived-pair.toml" "$scratch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: native-failure-${{ matrix.session }}-${{ github.sha }}
          path: target/native-${{ matrix.session }}/*
          if-no-files-found: error
  native-graphical-windows:
    if: github.event_name != 'schedule'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare isolated temporary files
        shell: bash
        run: |
          mkdir -p target/tmp
          for name in TMPDIR TMP TEMP; do
            echo "${name}=${GITHUB_WORKSPACE}/target/tmp" >> "$GITHUB_ENV"
          done
      - run: rustup toolchain install
      - name: Prepare authenticated test-only native OpenGL driver
        shell: pwsh
        run: '& crates/gui/native/prepare-windows-mesa.ps1'
      - run: cargo build -p auditorylab-gui -p auditorylab-cli --locked
      - name: Compile independent official-SDK text-range control
        shell: pwsh
        run: '& crates/gui/native/prepare-windows-control.ps1'
      - name: Production UIA, native keys, and common-dialog owner qualification
        timeout-minutes: 5
        shell: pwsh
        run: |
          $scratch = Join-Path $PWD 'target/native-windows'
          & target/debug/auditorylab.exe --library-dir "$scratch/library" library init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Use the built-in desktop host as the controlled UIA client;
          # retain MTA so its COM model matches the previous client host.
          powershell.exe -MTA -NoProfile -File crates/gui/native/windows.ps1 -Binary target/debug/auditorylab-gui.exe -Fixture crates/core/tests/fixtures/recipes/custom-derived-pair.toml -Scratch $scratch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: native-failure-windows-${{ github.sha }}
          path: target/native-windows/*
          if-no-files-found: error
  required:
    if: always() && github.event_name != 'schedule'
    needs: [lint, domain, matrix, icons, native, package, package-macos, mutation, native-graphical-linux, native-graphical-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every applicable qualification
        env:
          RESULTS: ${{ toJSON(needs) }}
          RELEASE: ${{ inputs.release }}
          CORE_CHANGED: ${{ needs.lint.outputs.core-changed }}
        run: python3 .github/qualification.py
