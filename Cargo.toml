[workspace]
resolver = "3"
members = ["crates/core", "crates/lib", "crates/cli", "crates/gui", "xtask"]
# Vendored patch sources are not members; tests needing their own dev-dependencies run from their manifests.
exclude = ["third_party"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99.1"
license = "MPL-2.0"
repository = "https://github.com/resoltico/AuditoryLab"
publish = false

[workspace.metadata.auditorylab]
build-number = 1

[workspace.dependencies]
allocation-counter = "0.8.1"
auditorylab = { path = "crates/lib" }
auditorylab-core = { path = "crates/core" }
cpal = "0.18.2"
ctrlc = { version = "3.5.2", features = ["termination"] }
# Keep portable arithmetic even when GUI transitive dependencies enable `arch`.
# libm's maintained override disables architecture intrinsics after feature unification.
libm = { version = "0.2.16", default-features = false, features = ["force-soft-floats"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
tempfile = "3.27.0"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "display"] }
waveadapter = "0.3.1"
winapi-util = "0.1.11"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg", "accessibility", "raw-window-handle-06", "unstable-winit-030"] }
slint-build = { version = "=1.18.1", default-features = false, features = ["compat-1-18"] }
libc = "0.2"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }

clap = { version = "4", features = ["derive", "string"] }
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_lifetimes = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Debug information for dependencies and incremental caches make up most of a
# build directory and are not needed to work on this workspace. Line tables
# keep file and line numbers in backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# The shipped binary keeps the arithmetic checks the tests run with.
[profile.release]
overflow-checks = true

# Selected by .cargo/mutants.toml: every mutant is built once and discarded.
[profile.mutants]
inherits = "test"
debug = false


[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true

# Preserve native typography, input, window scaling and accessibility contracts.
[patch.crates-io]
accesskit_unix = { path = "third_party/accesskit_unix" }
i-slint-core = { path = "third_party/i-slint-core" }
i-slint-compiler = { path = "third_party/i-slint-compiler" }
i-slint-backend-winit = { path = "third_party/i-slint-backend-winit" }
parley = { path = "third_party/parley" }
winit = { path = "third_party/winit" }
